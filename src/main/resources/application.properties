# Open api;
springdoc.api-docs.path=/open-api
springdoc.swagger-ui.path=/swagger-ui.html

# Datasource;
spring.datasource.url=jdbc:postgresql://localhost:54320/shopping
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase;
spring.liquibase.change-log= classpath:db/db.changelog-master.yaml
spring.liquibase.url= jdbc:postgresql://localhost:54320/shopping
spring.liquibase.user= user
spring.liquibase.password= password

# Miscellaneous
spring.application.name=Api
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

