# Miscellaneous
spring.application.name=Api
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Open api;
springdoc.api-docs.path=/open-api
springdoc.swagger-ui.path=/swagger-ui.html

# Datasource;
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54320/shopping}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase;
spring.liquibase.change-log=classpath:db/db.changelog-master.yaml
spring.liquibase.url= ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54320/shopping}
spring.liquibase.user=${SPRING_DATASOURCE_USERNAME:user}
spring.liquibase.password=${SPRING_DATASOURCE_PASSWORD:password}

